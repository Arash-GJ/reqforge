[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "reqforge-cli"
version = "0.1.0"
description = "Async API testing CLI with YAML suites and CI reports"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ReqForge Contributors"}]
dependencies = ["typer>=0.12,<1", "httpx>=0.27,<1", "rich>=13,<15", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-cov>=5,<8", "ruff>=0.8,<1"]

[project.scripts]
reqforge = "reqforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/reqforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
